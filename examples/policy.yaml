# An example policy (design §9). Every name and address here is made up.
# Validate it with:  zoeymcp check --config examples/policy.yaml
#
# Secrets never appear in a policy, only references: store:<name> for the vault's encrypted
# store, or env:<VAR>. The review pins below are illustrative; real ones come from
# `zoeymcp review`, or the portal's review screen, as a fragment to merge here: this example is
# declarative, a merge source. The shipped compose files are managed instead (operations.md §34).

version: 1
mode: declarative
gateway_key_generation: 1

# The portal. Leave this block out for no portal.
admin:
  listen: 127.0.0.1:8081 # the compose files set their own
  # The exact origins the browser uses: http only on localhost, otherwise https.
  origins: [http://localhost:8081, https://zoeymcp.tailnet.example]

credentials:
  music-stats:
    kind: query
    param: api_key
    secret: store:music-stats
  broker-mcp:
    kind: oauth2
    token_url: https://auth.broker.example/oauth/token
    client_id: store:broker-client-id
    refresh_token: store:broker-refresh # rotated in place in the store
    rotates: true
    extra_params:
      resource: https://mcp.broker.example/
    expected_scopes: [read, trade]

connectors:
  mail-out:
    kind: smtp
    host: smtp.mail.example
    port: 465
    username: store:mail-user
    password: store:mail-pass # bound to host, port, from and to
    from: "Agent <agent@mail.example>"
    to: [partner@mail.example]
    max_per_day: 20

routes:
  - name: stats # a direct route for a sandbox script
    prefix: /stats
    upstream: https://api.stats.example
    credential: music-stats
    callers:
      - placeholder: ph-agent1-stats-4c1f9b27
    query:
      force: { user: alice }
      strip: [api_key]
    rules:
      - methods: [GET]
        paths: [/2.0/**]

  - name: broker-mcp
    prefix: /broker
    upstream: https://mcp.broker.example
    credential: broker-mcp
    callers: [gateway] # the gateway only
    stream: true
    rules:
      - methods: [GET, POST, DELETE]
        paths: [/mcp]

  - name: mail-send
    prefix: /mail
    connector: mail-out
    callers: [gateway]
    rules:
      - methods: [GET]
        paths: [/config]
      - methods: [POST]
        paths: [/send]

gateway:
  # Host header values the gateway answers to; IPv6 addresses go without brackets.
  hosts: [localhost, 127.0.0.1, "::1", zoeymcp.tailnet.example]

  clients:
    agent1:
      # From `zoeymcp client-token`: the agent sends the token as Authorization: Bearer,
      # and the policy holds only its hash.
      token_sha256: sha256:8ca973db011281c88e678afeb86d1955579aed24fd7deeae43155fe7aabb0f43
      # The agent's network as the gateway sees it (the direct peer, never X-Forwarded-For).
      sources: [192.0.2.0/24]
      # A human watches this client, so it may be asked to approve calls.
      approvals: { attended: true }
      servers: [broker-read, broker-trade, mail]

  approvals:
    approver: elicitation
    timeout: 300
    budget_chars: 3000

  servers:
    broker-read:
      kind: remote
      route: broker-mcp
      path: /mcp
      era: modern # written by `zoeymcp review`
      tools:
        include: [get_quote, list_positions]
        allow: [get_quote, list_positions]
      review:
        get_quote: sha256:f38bdb5361113171a5d49e2806e5e89fb9e1572c270a33d42c377b4447c30538
        list_positions: sha256:2af456c008eb20c98470ebb4f890f9d248ca9451f2367ff8f1022d701d753cce

    broker-trade:
      kind: remote
      route: broker-mcp
      path: /mcp
      tools:
        include: [place_order, cancel_order]
        approve: [place_order, cancel_order]
      review:
        place_order: sha256:f317bc9db239b40a77b4c454dd6dae362008d39485fcb2359844c73cd998ef97
        cancel_order: sha256:26c3ac15931603b2f20397630050036633fd11d56ea08bd91e52895e92313ac7
      on_drift: fail

    # A toolkit runs inside the gateway (examples/toolkits): it reaches the vault only through
    # its slots, with the rules listed here, and shows the human the exact message to send.
    mail:
      kind: toolkit
      module: example_toolkits.mail
      tools:
        include: [send_note]
        approve: [send_note]
      review: # from `zoeymcp review mail`
        send_note: sha256:34aecee572ddd193955a4678774a9dc8cdd8c3a08f05f84c89e38b1c3631db32
      slots:
        mail:
          route: mail-send
          rules:
            - { methods: [GET], paths: [/config] }
            - { methods: [POST], paths: [/send], approved: true }

# A stdio MCP server behind a bridge (docs/operations.md §33, profiles/stdio-bridge.yaml): a local
# MCP route to the bridge, with its token as the route's header credential, and a remote server
# on that route; the gateway can't tell it from any other. Uncommented, each part goes under its
# section above. As written it is the hardened tier's (examples/bridge/compose.bridge.yaml); in
# the standard tier the upstream is the bridge's socket, and allow_insecure_upstream and the
# program's egress list go (nothing there could enforce it).
