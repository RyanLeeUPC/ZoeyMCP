version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    # The official image, and the two example images' uv stages, pinned like the root's: one
    # group, so all three move in one pull request (a unit test keeps the three pins equal).
    directories: [/, /examples/bridge, /examples/derived-image]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]
