version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the build action's own pins: a composite action in a folder of its own
    # is updated only when its folder is listed.
    directories: [/, /.github/actions/build-image]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    # The official image, and the two example images' uv stages, pinned like the root's: one
    # group, so all three move in one pull request (a unit test keeps the three pins equal).
    # .github/pins holds the images pinned where no updater reads (compose anchors, the smoke
    # script, workflow literals); the same test names their copies to change with it (D-162).
    directories: [/, /examples/bridge, /examples/derived-image, /.github/pins]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]
