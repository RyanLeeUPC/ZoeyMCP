name: release

# Publishes the official image from a v* tag (M8 design L.3, Z24; docs/operations.md §37). Four
# jobs, each with only the permissions it needs: guard, with read access alone, refuses a tag that
# isn't a version naming a commit on main; build, unprivileged, runs the build action (the same
# one ci.yml's dry run runs) with its compare and scan enforced; publish, under the release
# environment, pushes the layout build compared, by its digest, and attests it, running no build,
# scan or diff tool; release-notes, the one job that may write to the repository, creates the
# GitHub release with the digests and the attestation bundle.
#
# NO v* TAG MAY BE PUSHED to this repository, or to a fork that publishes its own image, before the
# repository's release settings exist (register D-237): a tag ruleset limiting who may create,
# update and delete v* tags, immutable releases, and a release environment with a required
# reviewer and a deployment rule allowing only v* tags. A v* tag push runs this file as it is at
# the tagged commit, so whoever can push a branch and a tag can edit the guard away: the guard
# catches mistakes, and those settings are the control (E-4). GitHub creates the release
# environment unprotected the first time a job names it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/ryanleeupc/zoeymcp
  # The one tool publish runs on the image, pinned by digest.
  SKOPEO: quay.io/skopeo/stable:v1.22.3-immutable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5

jobs:
  # A shallow checkout would fail the ancestry check on an honest tag (F15). The ancestry check
  # comes first, so a tag off main fails on it whatever else is wrong with it.
  guard:
    name: the tag is a version on main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag names a commit on main, is a version, and is the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refused: a release tag must name a commit on main" >&2
            exit 1
          fi
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "refused: a release tag is v<major>.<minor>.<patch>, not $TAG" >&2
            exit 1
          fi
          version="$(python3 -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$version" != "${TAG#v}" ]; then
            echo "refused: the tag is $TAG but pyproject.toml's version is $version" >&2
            exit 1
          fi

  # No token with write access and no OIDC token exist here, so a compromised BuildKit, scanner or
  # differ can sign nothing and push nothing (T-6).
  build:
    name: build twice and compare
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      index-digest: ${{ steps.image.outputs.index-digest }}
      platform-digest: ${{ steps.image.outputs.platform-digest }}
      source-tree: ${{ steps.image.outputs.source-tree }}
      buildkit: ${{ steps.image.outputs.buildkit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        id: image
        with:
          ref: ${{ github.sha }}
          compare: enforce
          scan: enforce
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: |
            ${{ steps.image.outputs.layout }}
            ${{ steps.image.outputs.sbom }}
          if-no-files-found: error
          retention-days: 14

  # Once a job lists a permission the unlisted ones are none, so contents: read is named for the
  # checkout (SC-4), which gives oci.py and the tag's tree.
  publish:
    name: publish the compared image
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      index-digest: ${{ needs.build.outputs.index-digest }}
      platform-digest: ${{ needs.build.outputs.platform-digest }}
      source-tree: ${{ needs.build.outputs.source-tree }}
      buildkit: ${{ needs.build.outputs.buildkit }}
    env:
      INDEX: ${{ needs.build.outputs.index-digest }}
      PLATFORM: ${{ needs.build.outputs.platform-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}/release
      - name: The downloaded layout is the one build compared
        env:
          TREE: ${{ needs.build.outputs.source-tree }}
        run: |
          python3 -I .github/actions/build-image/oci.py digests "$RUNNER_TEMP/release/image" \
            | tee "$RUNNER_TEMP/downloaded.txt"
          grep -Fqx "index-digest=$INDEX" "$RUNNER_TEMP/downloaded.txt"
          grep -Fqx "platform-digest=$PLATFORM" "$RUNNER_TEMP/downloaded.txt"
          grep -Fqx "source-tree=$(git rev-parse 'HEAD^{tree}')" "$RUNNER_TEMP/downloaded.txt"
          test "$TREE" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Sign in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s\n' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The compared layout itself, every manifest of its index, so the pushed index is the one
      # build made (SC-12).
      - name: Push the compared layout by its digest
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$RUNNER_TEMP/release/image:/image:ro" \
            --volume "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO" copy --all --preserve-digests --authfile /auth.json \
            oci:/image "docker://$IMAGE@$INDEX"
      - name: The pushed index is the compared one
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO" inspect --raw --authfile /auth.json "docker://$IMAGE@$INDEX" \
            > "$RUNNER_TEMP/pushed.json"
          python3 -I .github/actions/build-image/oci.py index "$RUNNER_TEMP/pushed.json" \
            | tee "$RUNNER_TEMP/pushed.txt"
          grep -Fqx "index-digest=$INDEX" "$RUNNER_TEMP/pushed.txt"
          grep -Fqx "platform-digest=$PLATFORM" "$RUNNER_TEMP/pushed.txt"
      # The subject is the index digest: what the compose files pin and what gh attestation verify
      # checks (OPS-16). A repository a user owns, not an organization, can't create storage
      # records.
      - name: Provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/ryanleeupc/zoeymcp
          subject-digest: ${{ needs.build.outputs.index-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: SBOM attestation
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/ryanleeupc/zoeymcp
          subject-digest: ${{ needs.build.outputs.index-digest }}
          sbom-path: ${{ runner.temp }}/release/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      # One JSON-lines file holding both, as gh attestation download writes it, for --bundle.
      - name: One bundle with both attestations, for offline verification
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/attestations"
          printf '%s\n' "$PROVENANCE" "$SBOM" | sort -u | xargs -d '\n' jq -c . \
            | awk '!seen[$0]++' > "$RUNNER_TEMP/attestations/zoeymcp-$TAG.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/attestations/zoeymcp-$TAG.jsonl")" -eq 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestations
          path: ${{ runner.temp }}/attestations
          if-no-files-found: error
          retention-days: 14
      - name: Sign out of ghcr.io
        if: ${{ always() }}
        run: docker logout ghcr.io

  # Creating a release needs contents: write, which no other job holds (SC-4).
  release-notes:
    name: the GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestations
          path: ${{ runner.temp }}/attestations
      - name: Create the release, with its digests and attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          INDEX: ${{ needs.publish.outputs.index-digest }}
          PLATFORM: ${{ needs.publish.outputs.platform-digest }}
          TREE: ${{ needs.publish.outputs.source-tree }}
          BUILDKIT: ${{ needs.publish.outputs.buildkit }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "The official image, pinned by its index digest:"
            echo
            echo "    $IMAGE@$INDEX"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Index digest (pin this) | \`$INDEX\` |"
            echo "| Platform manifest digest (linux/amd64) | \`$PLATFORM\` |"
            echo "| Source tree | \`$TREE\` |"
            echo "| BuildKit | \`$BUILDKIT\` |"
            echo
            echo "Its line in release/digests.txt: \`${TAG#v} $INDEX $PLATFORM $TREE\`"
            echo
            echo "Check it on the host before deploying with scripts/check-official-image.sh"
            echo "(docs/operations.md §37); the attached bundle holds both attestations, for"
            echo "--bundle on a host without a GitHub account."
          } > "$notes"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ZoeyMCP $TAG" --notes-file "$notes" "$RUNNER_TEMP/attestations/zoeymcp-$TAG.jsonl"
