name: mutation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mutation.yml"
      - "scripts/mutation-gate.py"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    name: mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --all-extras --python 3.13
      - name: Run mutmut
        run: uv run --locked mutmut run --max-children 4 || true
      - run: uv run --locked mutmut export-cicd-stats
      - name: Surviving mutants
        run: uv run --locked mutmut results
      - name: Diffs of surviving mutants
        run: |
          uv run --locked mutmut results | awk -F: '/: survived$/ {gsub(/ /, "", $1); print $1}' > survivors.txt
          while read -r name; do
            echo "=== $name"
            uv run --locked mutmut show "$name"
          done < survivors.txt
      - name: Gate
        run: uv run --locked python scripts/mutation-gate.py mutants/mutmut-cicd-stats.json --min-score 89
