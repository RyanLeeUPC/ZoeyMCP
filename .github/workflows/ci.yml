name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.17"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      # The browser group too, so strict mypy sees Playwright's types in tests/browser.
      - run: uv sync --locked --all-extras --group browser --python 3.13
      # The build action's oci.py too, which the release dry run and release.yml's publish run.
      - run: >-
          uv run --locked ruff check
          src tests examples/toolkits examples/bridge .github/actions/build-image
      - run: >-
          uv run --locked ruff format --check
          src tests examples/toolkits examples/bridge .github/actions/build-image
      - run: uv run --locked mypy

  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    # The acceptance tests run here too, S9's walks among them; a hung one ends the job (register
    # D-170). Headroom (D-225): a commit whose test leg passes about 75% of this (45 of 60
    # minutes) raises it or trims the tests in that commit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run --locked pytest

  # The portal on Windows, a development host (M5 design B.5): its effect tests and its unit
  # files only, since other Windows-only failures are known (register D-92). A required check
  # since it stayed green over M7's runs: branch protection lists the required jobs by name, so
  # renaming this job means changing main's protection with it.
  portal-windows:
    name: portal tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras --python 3.13
      - run: >-
          uv run --locked pytest tests/portal
          tests/unit/test_actions.py tests/unit/test_admission.py tests/unit/test_approvalsview.py
          tests/unit/test_display.py tests/unit/test_drafts.py
          tests/unit/test_limits.py tests/unit/test_listen.py tests/unit/test_mode_words.py
          tests/unit/test_mutation_gaps_5.py
          tests/unit/test_no_secret_answers.py tests/unit/test_passkeys.py
          tests/unit/test_policy_callback.py tests/unit/test_policydiffview.py
          tests/unit/test_policyview.py
          tests/unit/test_portal_static.py tests/unit/test_portal_windows_list.py
          tests/unit/test_portal_wire.py
          tests/unit/test_refusal_doc.py tests/unit/test_refusals.py tests/unit/test_reviewview.py
          tests/unit/test_routes.py tests/unit/test_sessions.py tests/unit/test_setupcode.py
          tests/unit/test_webauthn.py tests/fakes/test_authenticator.py tests/fakes/test_browser.py

  # The portal in a real browser (M8 design step 27a; register D-222): the browser's own WebAuthn
  # stack over a CDP virtual authenticator, the page's CSP and Trusted Types in force, every
  # page watched, the network out of reach (tests/browser/engines.py). Playwright is the browser
  # dependency group, which no other job syncs. Traces of a failed test are kept a week (they hold
  # only a throwaway vault's codes and sessions). Both jobs are new names and not required until
  # they have a green streak: main's protection lists required jobs by name (register D-238).
  browser:
    name: portal in a browser (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras --group browser --python 3.13
      # The headless shell Playwright 1.63 pins, and the OS packages it needs; not cached
      # (restoring takes about as long as downloading).
      - run: uv run --locked playwright install --with-deps --only-shell chromium
      - run: uv run --locked pytest tests/browser
        env:
          ZOEYMCP_BROWSER: chromium
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-traces-chromium
          path: test-results/
          retention-days: 7

  # The same tests in the runner's installed Edge: nothing is downloaded, so the browser moves
  # with the runner image, ahead of what Playwright was tested against.
  browser-windows:
    name: portal in a browser (Edge on Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras --group browser --python 3.13
      - run: uv run --locked pytest tests/browser
        env:
          ZOEYMCP_BROWSER: msedge
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-traces-edge
          path: test-results/
          retention-days: 7

  image:
    name: image build and smoke test
    runs-on: ubuntu-24.04
    # The bridge's rows (both shapes, M7 design L) run in the smoke test too, and the last step
    # builds the image twice more (about 3 minutes; the job took 19 minutes before it).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: >-
          docker build
          --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          --build-arg SOURCE_REVISION="$(git rev-parse HEAD)"
          --build-arg SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          -t zoeymcp:ci .
      - name: Labels match the source
        run: |
          tree="$(docker inspect zoeymcp:ci --format '{{ index .Config.Labels "io.zoeymcp.source-tree" }}')"
          test "$tree" = "$(git rev-parse 'HEAD^{tree}')"
      # Contract 51's Squid, by the digest the smoke script pins, so a registry failure shows here.
      - name: Pull the pinned Squid
        run: |
          squid="$(sed -n 's/^squid_image=//p' scripts/smoke-image.sh)"
          test -n "$squid"
          docker pull "$squid"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      # The bridge example's image (M7 design C.7): the official layers plus /opt/stdio-server,
      # verified against the official one before anything runs it.
      - name: Bridge image with the example stdio server, verified against the official one
        run: |
          sh examples/bridge/lock.sh
          docker build -f examples/bridge/Dockerfile \
            --build-context server=examples/bridge/server/dist \
            --build-arg OFFICIAL=zoeymcp:ci -t zoeymcp-bridge-fetch:ci examples/bridge
          sh examples/bridge/verify.sh --bridge zoeymcp:ci zoeymcp-bridge-fetch:ci
      - name: Smoke test (hardened vault, standard tier, Squid, the bridge in both shapes)
        run: sh scripts/smoke-image.sh --bridge zoeymcp-bridge-fetch:ci zoeymcp:ci
      - name: Derived image with the example toolkits, verified against the official one
        run: |
          sh examples/derived-image/lock.sh zoeymcp:ci
          docker build -f examples/derived-image/Dockerfile \
            --build-context toolkit=examples/toolkits/dist \
            --build-arg OFFICIAL=zoeymcp:ci -t zoeymcp-derived:ci examples/derived-image
          sh examples/derived-image/verify.sh zoeymcp:ci zoeymcp-derived:ci
      # R52's reproducible build (M8 design L.4): the commit built twice more, each from scratch on
      # a fresh builder with a pinned BuildKit, to OCI layouts with rewrite-timestamp. A report for
      # now: it says whether the two platform manifest digests match and, if not, what differs;
      # release.yml's build enforces it, and so does the release dry run below once its own first
      # compare matches (L.2, BP-4). The index digest is never compared: it carries attestation
      # timestamps.
      - name: Reproducible build, twice from scratch (a report)
        run: |
          set -o pipefail
          buildkit=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          for build in first second; do
            docker buildx create --name "repro-$build" --driver docker-container \
              --driver-opt "image=$buildkit"
            docker buildx build --builder "repro-$build" --platform linux/amd64 \
              --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
              --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" \
              --build-arg SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" \
              --output "type=oci,dest=$RUNNER_TEMP/repro-$build,tar=false,rewrite-timestamp=true" .
            docker buildx rm "repro-$build"
          done
          python3 -I - "$RUNNER_TEMP/repro-first" "$RUNNER_TEMP/repro-second" <<'PY' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          import hashlib, json, os, sys, tarfile
          def blob(layout, digest):
              return os.path.join(layout, "blobs", *digest.split(":", 1))
          def read(layout, digest):
              with open(blob(layout, digest), "rb") as handle:
                  return json.load(handle)
          def platform(layout):
              # index.json names the platform manifest, or an index that does; attestation
              # manifests are platform unknown/unknown.
              with open(os.path.join(layout, "index.json"), "rb") as handle:
                  found = json.load(handle)["manifests"]
              while True:
                  [entry] = [m for m in found if m.get("platform", {}).get("os") != "unknown"]
                  if "index" not in entry["mediaType"]:
                      return entry["digest"]
                  found = read(layout, entry["digest"])["manifests"]
          def files(layout, digest):
              found = {}
              with tarfile.open(blob(layout, digest)) as layer:
                  for member in layer:
                      body = layer.extractfile(member) if member.isfile() else None
                      content = hashlib.sha256(body.read()).hexdigest()[:12] if body else ""
                      found[member.name] = (oct(member.mode), member.uid, member.gid,
                                            member.mtime, member.linkname, content)
              return found
          layouts = sys.argv[1:3]
          digests = [platform(layout) for layout in layouts]
          print(f"Reproducible build: first {digests[0]}, second {digests[1]}")
          if digests[0] == digests[1]:
              print("The platform manifest digests match.")
              sys.exit(0)
          print("The platform manifest digests differ.")
          manifests = [read(layout, digest) for layout, digest in zip(layouts, digests)]
          configs = [read(layout, m["config"]["digest"]) for layout, m in zip(layouts, manifests)]
          for key in sorted(set(configs[0]) | set(configs[1])):
              if configs[0].get(key) != configs[1].get(key):
                  print(f"- config: {key} differs")
          layers = [m["layers"] for m in manifests]
          if len(layers[0]) != len(layers[1]):
              print(f"- layers: {len(layers[0])} and {len(layers[1])}")
          for number, (one, two) in enumerate(zip(*layers), 1):
              if one["digest"] == two["digest"]:
                  continue
              first, second = files(layouts[0], one["digest"]), files(layouts[1], two["digest"])
              changed = sorted(n for n in set(first) | set(second) if first.get(n) != second.get(n))
              print(f"- layer {number}: {len(changed)} entries differ")
              for name in changed[:20]:
                  print(f"  - {name}: {first.get(name)} / {second.get(name)}")
          PY

  # The release's build, run as a dry run on every push to dev or main and every pull request (M8
  # design L.2): the same action release.yml's build job runs, with read access only and no OIDC
  # token, pushing nothing. Its scan is a report, so an advisory published on an unrelated day
  # never turns a change red (BP-4). A new job name: it fails open until main's protection lists
  # it (register D-238).
  release-dry-run:
    name: image release dry run
    runs-on: ubuntu-24.04
    # Two builds with an SBOM and provenance each, the recipes and the scan.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          ref: ${{ github.sha }}
          # BP-4: enforced since this job's own first compare matched (CI 41763084017, 2399668):
          # a commit whose two builds differ fails here, as release.yml's build would.
          compare: enforce
          scan: report
