name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.17"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras --python 3.13
      - run: uv run --locked ruff check src tests examples/toolkits
      - run: uv run --locked ruff format --check src tests examples/toolkits
      - run: uv run --locked mypy

  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run --locked pytest

  image:
    name: image build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: >-
          docker build
          --build-arg SOURCE_REVISION="$(git rev-parse HEAD)"
          --build-arg SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          -t zoeymcp:ci .
      - name: Labels match the source
        run: |
          tree="$(docker inspect zoeymcp:ci --format '{{ index .Config.Labels "io.zoeymcp.source-tree" }}')"
          test "$tree" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Smoke test (hardened vault, standard tier)
        run: sh scripts/smoke-image.sh zoeymcp:ci
