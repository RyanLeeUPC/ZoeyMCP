# ZoeyMCP, hardened tier (design §3.3, §3.4).
#
# M1 runs the vault alone; the gateway joins on the internal network in M3. Nothing here is
# published to the host: agents' sandboxes reach the vault on the opt-in `direct` network.
#
#   ZOEYMCP_MASTER_KEY=...  docker compose -f deploy/compose.hardened.yaml up -d
#
# Set secrets through the vault's admin socket, never in this file:
#
#   printf '%s' "$VALUE" | docker compose -f deploy/compose.hardened.yaml exec -T vault \
#     zoeymcp secret set music-stats

name: zoeymcp

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

networks:
  # The gateway's link to the vault (M3). Internal: no route out.
  internal:
    internal: true
  # Opt-in: agent sandboxes calling plain API routes. Attach their containers to it.
  direct:
    internal: true
  # The vault's way out, directly or through an egress proxy.
  egress: {}

services:
  vault:
    <<: *hardened
    # For a real deployment, pin by digest: ghcr.io/ryanleeupc/zoeymcp@sha256:...
    image: ${ZOEYMCP_IMAGE:-zoeymcp:local}
    command: [vault, --listen, "0.0.0.0:8080"]
    user: "10001:10001"
    # On stop, OAuth refreshes in flight finish and are saved (up to 45 s) before the vault exits.
    stop_grace_period: 50s
    environment:
      ZOEYMCP_MASTER_KEY: ${ZOEYMCP_MASTER_KEY:?generate one with `zoeymcp keygen`}
      # The policy, inline: no bind mounts needed. Reload it with `docker compose kill -s HUP vault`
      # after changing a file-based policy, or recreate the container for this inline one.
      ZOEYMCP_CONFIG: |
        version: 1
        mode: declarative
        admin:
          listen: 0.0.0.0:8081
          hosts: [localhost, 127.0.0.1]
        credentials:
          music-stats: {kind: query, param: api_key, secret: store:music-stats}
        routes:
          - name: stats
            prefix: /stats
            upstream: https://ws.audioscrobbler.com
            credential: music-stats
            callers:
              - placeholder: ph-replace-me-with-a-long-random-value
            query:
              force: {user: your-username}
            rules:
              - methods: [GET]
                paths: [/2.0/]
    tmpfs:
      - /tmp:size=16m
      - /run/zoeymcp:size=1m,mode=0700,uid=10001,gid=10001
    networks: [internal, direct, egress]
    volumes:
      - vault-state:/state

volumes:
  vault-state: {}
