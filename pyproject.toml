[project]
name = "zoeymcp"
version = "0.0.1.dev0"
description = "Self-hosted credential vault and MCP gateway: agents never hold real secrets, and consequential tool calls need approval of the exact arguments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Lee" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/RyanLeeUPC/ZoeyMCP"

[project.scripts]
zoeymcp = "zoeymcp.cli.main:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mutmut>=3",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoeymcp"]

[tool.uv]
# Supply-chain cooldown: resolve only releases older than this date. Move it forward
# deliberately (about two weeks behind today) when updating the lock.
exclude-newer = "2026-10-03T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.mutmut]
# Mutation testing for the security-critical modules (CI only: mutmut doesn't run on Windows).
source_paths = ["src"]
only_mutate = [
    "*zoeymcp/vault/request.py",
    "*zoeymcp/vault/store.py",
    "*zoeymcp/vault/bindings.py",
    "*zoeymcp/vault/oauth/protocol.py",
    "*zoeymcp/vault/oauth/pkce.py",
    "*zoeymcp/vault/oauth/tokens.py",
    "*zoeymcp/common/textrules.py",
    "*zoeymcp/common/canonical.py",
    "*zoeymcp/common/policy/check.py",
]
pytest_add_cli_args_test_selection = ["tests/unit"]
# The hygiene test checks the repository itself, which mutmut only partly copies.
pytest_add_cli_args = ["--ignore=tests/unit/test_source_hygiene.py"]
also_copy = ["examples", "profiles", "tests"]
