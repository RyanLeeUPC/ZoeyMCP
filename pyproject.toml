[project]
name = "zoeymcp"
version = "0.0.1.dev0"
description = "Self-hosted credential vault and MCP gateway: agents never hold real secrets, and consequential tool calls need approval of the exact arguments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Lee" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "certifi>=2026.10.19",
    "cryptography>=43",
    "httpx>=0.27",
    # common.policy.fields encodes hosts with it, as httpx does; declared, not only httpx's.
    "idna>=3.7",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The gateway's dependencies, exact with hashes in uv.lock. The image installs them only into the
# gateway's virtual environment, so the vault's interpreter never has them.
gateway = [
    "jsonschema>=4.23",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "regex>=2024.9",
]

[project.urls]
Repository = "https://github.com/RyanLeeUPC/ZoeyMCP"

[project.scripts]
zoeymcp = "zoeymcp.cli.main:main"

[dependency-groups]
# The gateway extra is part of development, so tests and strict mypy see the gateway modules.
dev = [
    "zoeymcp[gateway]",
    "hypothesis>=6.100",
    "mutmut>=3",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
    "types-regex>=2024.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoeymcp"]

[tool.uv]
# Supply-chain cooldown: resolve only releases older than this date. Move it forward
# deliberately (about two weeks behind today) when updating the lock.
exclude-newer = "2026-10-03T00:00:00Z"
# One exception: certifi 2026.10.19 removes the emSign ECC Root CA - G3, whose intermediates
# had compromised keys (GHSA-6q48-6c7w-9gw2, 2026-10-20). Drop it when exclude-newer passes it.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"examples/toolkits/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "examples/toolkits/src", "examples/toolkits/tests"]
mypy_path = "examples/toolkits/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
# The example toolkits are tested in place, not installed, so uv.lock stays as it is.
testpaths = ["tests", "examples/toolkits/tests"]
pythonpath = ["examples/toolkits/src"]
addopts = ["-q", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.mutmut]
# Mutation testing for the security-critical modules (CI only: mutmut doesn't run on Windows).
source_paths = ["src"]
only_mutate = [
    "*zoeymcp/vault/request.py",
    "*zoeymcp/vault/store.py",
    "*zoeymcp/vault/bindings.py",
    "*zoeymcp/vault/secretplan.py",
    "*zoeymcp/vault/health.py",
    "*zoeymcp/vault/reports.py",
    "*zoeymcp/vault/ledgerview.py",
    "*zoeymcp/vault/oauth/protocol.py",
    "*zoeymcp/vault/oauth/pkce.py",
    "*zoeymcp/vault/oauth/tokens.py",
    "*zoeymcp/vault/oauth/login.py",
    "*zoeymcp/vault/oauth/discovery.py",
    "*zoeymcp/vault/oauth/dcr.py",
    "*zoeymcp/vault/onboarding.py",
    "*zoeymcp/vault/internal.py",
    "*zoeymcp/vault/reviewjobs.py",
    "*zoeymcp/vault/gatewaykeys.py",
    "*zoeymcp/vault/peer.py",
    "*zoeymcp/portal/webauthn.py",
    "*zoeymcp/portal/admission.py",
    "*zoeymcp/portal/display.py",
    "*zoeymcp/portal/routes.py",
    "*zoeymcp/portal/refusals.py",
    "*zoeymcp/portal/sessions.py",
    "*zoeymcp/portal/limits.py",
    "*zoeymcp/portal/actions.py",
    "*zoeymcp/portal/passkeys.py",
    "*zoeymcp/portal/setupcode.py",
    "*zoeymcp/portal/listen.py",
    "*zoeymcp/portal/policyview.py",
    "*zoeymcp/portal/reviewview.py",
    "*zoeymcp/common/textrules.py",
    "*zoeymcp/common/canonical.py",
    "*zoeymcp/common/approvaltext.py",
    "*zoeymcp/common/ledgerformat.py",
    "*zoeymcp/common/ledgerjoin.py",
    "*zoeymcp/common/files.py",
    "*zoeymcp/common/netguard.py",
    "*zoeymcp/common/egresslist.py",
    "*zoeymcp/common/pinhash.py",
    "*zoeymcp/common/reviewreport.py",
    "*zoeymcp/common/suggest.py",
    "*zoeymcp/common/policy/check.py",
    "*zoeymcp/common/policy/fields.py",
    "*zoeymcp/common/policy/callback.py",
    "*zoeymcp/common/policy/match.py",
    "*zoeymcp/common/policy/view.py",
    "*zoeymcp/common/policy/change.py",
    "*zoeymcp/common/policy/emit.py",
    "*zoeymcp/common/policy/merge.py",
    "*zoeymcp/gateway/pins.py",
    "*zoeymcp/gateway/findings.py",
    "*zoeymcp/gateway/schemas.py",
    "*zoeymcp/gateway/sanitize.py",
    "*zoeymcp/gateway/access.py",
    "*zoeymcp/gateway/connstate.py",
    "*zoeymcp/gateway/egressrules.py",
    "*zoeymcp/gateway/approvals.py",
    "*zoeymcp/gateway/reporting.py",
    "*zoeymcp/vault/connectors/mailmsg.py",
    "*zoeymcp/vault/connectors/tunnel.py",
    "*zoeymcp/vault/connectors/smtpflow.py",
    "*zoeymcp/vault/connectors/sendjournal.py",
    "*zoeymcp/toolkit/params.py",
    "*zoeymcp/toolkit/plan.py",
    "*zoeymcp/toolkit/rules.py",
    "*zoeymcp/entrypoint/env.py",
    "*zoeymcp/cli/choices.py",
    "*zoeymcp/egress/connect.py",
]
pytest_add_cli_args_test_selection = ["tests/unit"]
# The hygiene, import-guard and mutation-script tests check the repository itself (the lock, the
# smoke script, scripts/), which mutmut only partly copies.
pytest_add_cli_args = [
    "--ignore=tests/unit/test_source_hygiene.py",
    "--ignore=tests/unit/test_import_guards.py",
    "--ignore=tests/unit/test_mutation_scripts.py",
]
# docs: test_refusal_doc.py checks operations.md's table against the refusal catalogue.
also_copy = ["deploy", "docs", "examples", "profiles", "tests"]

# Per-module minimum mutation scores, checked by scripts/mutation-gate.py on top of the overall
# minimum: a glob over dotted module names to a percentage, like "zoeymcp.portal.*" = 90.
[tool.zoeymcp.mutation-floors]
"zoeymcp.common.ledgerjoin" = 95
