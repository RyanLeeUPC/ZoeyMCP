[project]
name = "zoeymcp"
version = "0.0.1.dev0"
description = "Self-hosted credential vault and MCP gateway: agents never hold real secrets, and consequential tool calls need approval of the exact arguments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Lee" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "certifi>=2026.10.19",
    "cryptography>=43",
    "httpx>=0.27",
    # vault.netclient's guarded backend subclasses its network backend; declared, not only httpx's.
    "httpcore>=1.0,<2",
    # common.policy.fields encodes hosts with it, as httpx does; declared, not only httpx's.
    "idna>=3.7",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The gateway's dependencies, exact with hashes in uv.lock. The image installs them only into the
# gateway's virtual environment, so the vault's interpreter never has them.
gateway = [
    "jsonschema>=4.23",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "regex>=2024.9",
]

[project.urls]
Repository = "https://github.com/RyanLeeUPC/ZoeyMCP"

[project.scripts]
zoeymcp = "zoeymcp.cli.main:main"

[dependency-groups]
# The gateway extra is part of development, so tests and strict mypy see the gateway modules.
dev = [
    "zoeymcp[gateway]",
    "hypothesis>=6.100",
    "mutmut>=3",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
    "types-regex>=2024.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoeymcp"]

[tool.uv]
# Supply-chain cooldown: resolve only releases older than this date. Move it forward
# deliberately (about two weeks behind today) when updating the lock.
exclude-newer = "2026-10-03T00:00:00Z"
# Two exceptions; drop each when exclude-newer passes it. certifi 2026.10.19 removes the emSign
# ECC Root CA - G3, whose intermediates had compromised keys (GHSA-6q48-6c7w-9gw2, 2026-10-20).
# opentelemetry-api 1.45.1 bounds tracestate parsing (GHSA-xcq7-p3pf-p88h, 2026-10-22); the
# gateway drops the SDK's middleware that parses it, so the fix matters to scanners, not callers.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", opentelemetry-api = "2026-10-07T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"examples/toolkits/tests/**" = ["S101"]
"examples/bridge/server/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = [
    "src",
    "tests",
    "examples/toolkits/src",
    "examples/toolkits/tests",
    "examples/bridge/server/src",
    "examples/bridge/server/tests",
]
mypy_path = ["examples/toolkits/src", "examples/bridge/server/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
# The example toolkits and the bridge example's server are tested in place, not installed, so
# uv.lock stays as it is.
testpaths = ["tests", "examples/toolkits/tests", "examples/bridge/server/tests"]
pythonpath = ["examples/toolkits/src", "examples/bridge/server/src"]
addopts = ["-q", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.mutmut]
# Mutation testing for the security-critical modules (CI only: mutmut doesn't run on Windows).
source_paths = ["src"]
only_mutate = [
    "*zoeymcp/vault/request.py",
    "*zoeymcp/vault/store.py",
    "*zoeymcp/vault/bindings.py",
